    <!-- Fonts: preconnect opens the TLS handshake to both Google font hosts
         while the HTML is still parsing, so the woff2 fetch doesn't wait on
         connection setup. Keep these here rather than @import-ing in CSS,
         which would serialize the whole chain behind the app stylesheet. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Krona+One&display=swap"
